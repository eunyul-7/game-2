<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>병아리 슈팅</title>
<style>
  :root { --bg: #fde7f1; --panel: #cfe9ff; --text: #4a3b5c; --muted: #8a7a9b; --accent: #ff8fab; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 16px;
  }
  h1 { margin: 0; font-size: 1.4rem; }
  .hud { display: flex; gap: 20px; font-size: 1rem; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .hud b { color: var(--text); }
  /* 화면 크기에 맞춰 자동 조절: 가로 폭과 남은 세로 높이(3:4 비율) 중 작은 쪽에 맞춤 */
  .wrap {
    position: relative;
    width: min(480px, 100%, calc((100vh - 150px) * 0.75));
    width: min(480px, 100%, calc((100dvh - 150px) * 0.75));
  }
  html, body { overscroll-behavior: none; }
  button { touch-action: manipulation; }
  .overlay { overflow-y: auto; }
  /* 화면이 낮거나 게임판이 작을 때 안내 글씨를 줄임 */
  @media (max-height: 760px), (max-width: 500px) {
    .overlay { gap: 6px; padding: 10px; }
    .overlay h2 { font-size: 1.3rem; }
    .overlay p { font-size: .82rem; line-height: 1.45; }
    .overlay button { padding: 8px 22px; font-size: 1rem; }
    .scores b { font-size: 1.3rem; }
  }
  @media (max-width: 500px) {
    body { padding: 8px 8px 12px; gap: 6px; justify-content: flex-start; }
    h1 { font-size: 1.15rem; }
    .hud { gap: 12px; font-size: .9rem; }
    .ctrl { padding: 5px 10px; font-size: .85rem; }
    .wrap { width: min(100%, calc((100dvh - 130px) * 0.75)); }
    .overlay p { font-size: .9rem; }
  }
  canvas { display: block; width: 100%; aspect-ratio: 3 / 4; background: var(--panel); border-radius: 12px; touch-action: none; }
  body { background: linear-gradient(180deg, #ffe3ef, #e3f0ff); }
  .ctrls { display: flex; gap: 8px; }
  .ctrl {
    font-size: .95rem; padding: 6px 12px; border-radius: 999px;
    background: #fff; color: var(--text); border: 2px solid #f3c6d8;
  }
  .ctrl:hover { background: #fff3f8; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(255, 245, 250, .85); border-radius: 12px; text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .scores { display: flex; gap: 12px; justify-content: center; margin-bottom: 6px; }
  .scores > span {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #fff; border: 2px solid #f3c6d8; border-radius: 12px; padding: 8px 16px; color: var(--muted); font-size: .9rem;
  }
  .scores b { font-size: 1.6rem; color: var(--text); }
  .overlay h2 { margin: 0; font-size: 1.6rem; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.6; }
  button {
    font: inherit; font-size: 1.1rem; padding: 10px 28px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
<h1>병아리 슈팅</h1>
<div class="hud">
  <span>목숨 <b id="lives">❤️❤️❤️</b></span>
  <span>점수 <b id="score">0</b></span>
  <span>최고 <b id="best">0</b></span>
  <span>레벨 <b id="level">1</b></span>
</div>
<div class="ctrls">
  <button class="ctrl" id="pauseBtn" title="일시정지 (P)">⏸ 일시정지</button>
  <button class="ctrl" id="soundBtn" title="소리 켜기/끄기 (M)">🔊 소리 켬</button>
</div>
<div class="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="title">병아리 슈팅</h2>
    <p id="msg"><b>← →</b> (또는 A, D)로 움직이고 <b>스페이스바</b>로 발사!<br>
      📱 휴대폰은 화면을 <b>손가락으로 좌우로 끌면</b> 움직이고, 총알은 <b>자동</b>으로 나가요.<br>
      목숨은 3개! 적에게 부딪히면 하나씩 줄고 적이 더 빨라져요.<br>
      시간이 지날수록 레벨이 올라 점점 어려워져요.<br>
      <b>P</b> 일시정지 · <b>M</b> 소리 끄기</p>
    <button id="start">시작</button>
  </div>
</div>
<script>
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const $ = id => document.getElementById(id);

  const MAX_LIVES = 3, HIT_SPEEDUP = 0.6, INVINCIBLE_FRAMES = 90, FIRE_DELAY = 10;

  let best = 0;
  try { best = Number(localStorage.getItem('shooter-best')) || 0; } catch {}
  $('best').textContent = best;

  // ---- 효과음 (음악 파일 없이 Web Audio API로 만듦) ----
  let muted = false;
  try { muted = localStorage.getItem('shooter-muted') === '1'; } catch {}
  let audio = null;
  function getAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio = new AC();
    }
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  // 짧은 음 하나: 시작 주파수 → 끝 주파수로 미끄러지는 소리
  function tone(freq, endFreq, dur, type = 'square', vol = 0.08, delay = 0) {
    if (muted) return;
    const ac = getAudio(); if (!ac) return;
    const t = ac.currentTime + delay;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t); osc.stop(t + dur);
  }
  const sfx = {
    shoot:   () => tone(880, 1400, 0.06, 'square', 0.03),
    hit:     () => tone(300, 200, 0.05, 'triangle', 0.06),
    pop:     () => { tone(520, 1200, 0.1, 'sine', 0.12); tone(1000, 1600, 0.08, 'sine', 0.06, 0.05); },
    hurt:    () => { tone(400, 90, 0.35, 'sawtooth', 0.1); },
    levelUp: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.1, i * 0.09)),
    over:    () => [523, 392, 330, 262].forEach((f, i) => tone(f, f * 0.98, 0.22, 'triangle', 0.12, i * 0.18)),
    start:   () => [392, 523, 659].forEach((f, i) => tone(f, f, 0.1, 'triangle', 0.1, i * 0.08)),
    pause:   () => tone(660, 440, 0.12, 'sine', 0.1),
  };
  function showSound() { $('soundBtn').textContent = muted ? '🔇 소리 끔' : '🔊 소리 켬'; }
  function toggleSound() {
    muted = !muted;
    try { localStorage.setItem('shooter-muted', muted ? '1' : '0'); } catch {}
    showSound();
    if (!muted) tone(660, 880, 0.1, 'sine', 0.1);
  }
  showSound();

  const player = { x: W / 2, y: H - 60, r: 18, speed: 6 };
  let bullets, enemies, particles, score, lives, hitBoost, invincible, running, frame, nextSpawn, fireCooldown;
  let paused = false, level = 1, levelBanner = 0;
  const LEVEL_FRAMES = 20 * 60;   // 약 20초마다 레벨 업
  const keys = { left: false, right: false, fire: false };
  // 터치(휴대폰) 조작: 손가락을 끈 만큼 병아리가 따라 움직임 (손가락이 병아리를 가리지 않게)
  let touchX = null;            // 병아리가 가야 할 목표 x (끌고 있을 때만)
  let dragStartX = 0, dragStartPlayer = 0;
  // 휴대폰/태블릿이면 총알 자동 발사
  let isTouch = matchMedia('(pointer: coarse)').matches;
  // 배경: 몽글몽글 구름 + 반짝이 + 하트
  const clouds = Array.from({ length: 6 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 0.6 + Math.random() * 0.8 }));
  const sparkles = Array.from({ length: 28 }, () => ({
    x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random(), t: Math.random() * 6, heart: Math.random() < 0.3,
  }));
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#bfe4ff');
  skyGrad.addColorStop(0.6, '#e6dcff');
  skyGrad.addColorStop(1, '#ffdcec');

  function showLives() {
    const n = Math.max(0, Math.min(MAX_LIVES, lives));
    $('lives').textContent = '❤️'.repeat(n) + '🤍'.repeat(MAX_LIVES - n);
  }

  function reset() {
    bullets = []; enemies = []; particles = [];
    score = 0; lives = MAX_LIVES; hitBoost = 0; invincible = 0;
    frame = 0; nextSpawn = 40; fireCooldown = 0;
    paused = false; level = 1; levelBanner = 0;
    player.x = W / 2;
    showLives();
    $('level').textContent = 1;
    $('pauseBtn').textContent = '⏸ 일시정지';
    $('score').textContent = 0;
  }

  // ---- 적 ----
  const ENEMY_TYPES = [
    { color: '#7ee0a1', r: 16, hp: 1, pts: 10 },   // 초록 슬라임
    { color: '#79b8ff', r: 20, hp: 2, pts: 25 },   // 파랑 슬라임
    { color: '#ff7b9c', r: 26, hp: 4, pts: 60 },   // 분홍 큰 슬라임
  ];

  // 난이도: 시간에 따라 오르는 레벨 + 점수
  function difficulty() { return (level - 1) + score / 1000; }

  function spawnEnemy() {
    const d = difficulty();
    const roll = Math.random();
    const t = roll < Math.min(0.35, 0.1 + d * 0.04) ? 2 : roll < Math.min(0.7, 0.38 + d * 0.05) ? 1 : 0;
    const type = ENEMY_TYPES[t];
    enemies.push({
      ...type,
      maxHp: type.hp,
      x: type.r + Math.random() * (W - type.r * 2),
      y: -type.r,
      vy: 1.2 + Math.random() * 1.2 + Math.min(4, d * 0.35),
      vx: (Math.random() - 0.5) * 1.5,
      wobble: Math.random() * Math.PI * 2,
      flash: 0,
    });
    nextSpawn = Math.max(10, 50 - d * 5) * (0.6 + Math.random() * 0.8);
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, color });
    }
  }

  // ---- 업데이트 ----
  function update() {
    frame++;

    // 시간이 지나면 레벨 업
    const newLevel = 1 + Math.floor(frame / LEVEL_FRAMES);
    if (newLevel > level) {
      level = newLevel;
      $('level').textContent = level;
      levelBanner = 90;
      sfx.levelUp();
    }
    if (levelBanner > 0) levelBanner--;

    // 이동
    if (keys.left) player.x -= player.speed;
    if (keys.right) player.x += player.speed;
    if (touchX !== null) player.x += Math.max(-player.speed * 2, Math.min(player.speed * 2, touchX - player.x));
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));

    // 발사 (누르고 있으면 연사, 터치 중엔 자동 발사)
    if (fireCooldown > 0) fireCooldown--;
    if ((keys.fire || isTouch || touchX !== null) && fireCooldown === 0) {
      bullets.push({ x: player.x, y: player.y - 22 });
      fireCooldown = FIRE_DELAY;
      sfx.shoot();
    }
    for (const b of bullets) b.y -= 10;
    bullets = bullets.filter(b => b.y > -10);

    // 적
    nextSpawn--;
    if (nextSpawn <= 0) spawnEnemy();
    for (const e of enemies) {
      e.wobble += 0.05;
      e.x += e.vx + Math.sin(e.wobble) * 0.6;
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
      e.y += e.vy + hitBoost;
      if (e.flash > 0) e.flash--;
    }
    enemies = enemies.filter(e => e.y - e.r < H);

    // 총알 ↔ 적
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
          b.y = -100; e.hp--; e.flash = 4;
          if (e.hp <= 0) { score += e.pts; burst(e.x, e.y, e.color); sfx.pop(); }
          else sfx.hit();
          break;
        }
      }
    }
    enemies = enemies.filter(e => e.hp > 0);

    // 적 ↔ 병아리
    if (invincible > 0) invincible--;
    else {
      for (const e of enemies) {
        if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 6) {
          lives--;
          showLives();
          burst(player.x, player.y, '#ffd93d', 18);
          if (lives <= 0) return gameOver();
          sfx.hurt();
          hitBoost += HIT_SPEEDUP;
          invincible = INVINCIBLE_FRAMES;
          enemies = enemies.filter(x => x !== e);
          break;
        }
      }
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles.filter(p => p.life > 0);

    if (frame % 5 === 0) $('score').textContent = score;
  }

  // ---- 그리기 ----
  function circle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlayer() {
    const { x, y } = player;
    const dead = !running && lives <= 0;
    // 발
    ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 6, y + 14); ctx.lineTo(x - 7, y + 22);
    ctx.moveTo(x + 6, y + 14); ctx.lineTo(x + 7, y + 22);
    ctx.stroke();
    // 몸
    circle(x, y, 19, '#ffd93d');
    circle(x - 5, y - 6, 8, 'rgba(255,255,255,.35)');
    // 머리 깃털
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath();
    ctx.ellipse(x - 3, y - 20, 3, 7, -0.4, 0, Math.PI * 2);
    ctx.ellipse(x + 3, y - 20, 3, 7, 0.4, 0, Math.PI * 2);
    ctx.fill();
    // 날개 (파닥)
    const flap = Math.sin(frame / 4) * 0.3;
    ctx.fillStyle = '#f7c51e';
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(x + side * 17, y + 3); ctx.rotate(side * (0.4 + flap));
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    // 볼터치
    circle(x - 10, y + 5, 3.5, 'rgba(255,120,150,.55)');
    circle(x + 10, y + 5, 3.5, 'rgba(255,120,150,.55)');
    // 눈
    ctx.strokeStyle = '#2b2b3a'; ctx.lineWidth = 2;
    for (const ex of [x - 6, x + 6]) {
      if (dead) {
        ctx.beginPath();
        ctx.moveTo(ex - 3, y - 5); ctx.lineTo(ex + 3, y + 1);
        ctx.moveTo(ex + 3, y - 5); ctx.lineTo(ex - 3, y + 1);
        ctx.stroke();
      } else if (frame % 150 > 144) {
        ctx.beginPath(); ctx.moveTo(ex - 3, y - 2); ctx.lineTo(ex + 3, y - 2); ctx.stroke();
      } else {
        circle(ex, y - 2, 3.5, '#2b2b3a');
        circle(ex + 1.2, y - 3.2, 1.3, '#fff');
      }
    }
    // 부리 (위를 향함)
    ctx.fillStyle = '#ff9f43';
    ctx.beginPath(); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x + 4, y + 4); ctx.lineTo(x, y + 10); ctx.closePath(); ctx.fill();
  }

  function drawEnemy(e) {
    const squish = 1 + Math.sin(e.wobble * 3) * 0.06;
    ctx.save(); ctx.translate(e.x, e.y); ctx.scale(squish, 2 - squish);
    ctx.fillStyle = e.flash ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, Math.PI, 0);
    ctx.lineTo(e.r, e.r * 0.6);
    ctx.quadraticCurveTo(0, e.r * 0.9, -e.r, e.r * 0.6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(74,59,92,.55)'; ctx.lineWidth = 2; ctx.stroke();
    // 눈 + 볼
    const s = e.r / 16;
    circle(-9 * s, 4 * s, 2.5 * s, 'rgba(255,120,150,.5)');
    circle(9 * s, 4 * s, 2.5 * s, 'rgba(255,120,150,.5)');
    circle(-5 * s, -2 * s, 2.5 * s, '#2b2b3a');
    circle(5 * s, -2 * s, 2.5 * s, '#2b2b3a');
    ctx.restore();
    // 체력바 (2칸 이상인 적만)
    if (e.maxHp > 1) {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * (e.hp / e.maxHp), 4);
    }
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 24 * s, y - 10 * s, 26 * s, 0, Math.PI * 2);
    ctx.arc(x + 50 * s, y, 20 * s, 0, Math.PI * 2);
    ctx.rect(x, y, 50 * s, 20 * s);
    ctx.fill();
  }

  function drawHeart(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.9);
    ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.4);
    ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
    ctx.fill();
  }

  function drawBackground() {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    const moving = running && !paused;
    const flow = 0.5 + Math.min(3, difficulty() * 0.15 + hitBoost * 0.3);  // 어려워질수록 배경도 빨리 흐름
    for (const c of clouds) {
      if (moving) { c.y += c.s * flow; if (c.y - 40 > H) { c.y = -40; c.x = Math.random() * (W - 60); } }
      drawCloud(c.x, c.y, c.s);
    }
    for (const s of sparkles) {
      if (moving) { s.y += s.s * flow * 0.8; s.t += 0.08; if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; } }
      const a = 0.4 + Math.sin(s.t) * 0.35;
      if (s.heart) { ctx.globalAlpha = a; drawHeart(s.x, s.y, 5 * s.s, '#ff9cc0'); }
      else {
        ctx.globalAlpha = a; ctx.fillStyle = '#ffffff';
        const r = 3 * s.s;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - r * 2); ctx.lineTo(s.x + r * 0.5, s.y - r * 0.5); ctx.lineTo(s.x + r * 2, s.y);
        ctx.lineTo(s.x + r * 0.5, s.y + r * 0.5); ctx.lineTo(s.x, s.y + r * 2); ctx.lineTo(s.x - r * 0.5, s.y + r * 0.5);
        ctx.lineTo(s.x - r * 2, s.y); ctx.lineTo(s.x - r * 0.5, s.y - r * 0.5); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    drawBackground();
    // 총알: 작은 노란 별 모양 알
    for (const b of bullets) {
      ctx.fillStyle = '#ff9f43';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 4.5, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff3a0';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 2.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
    for (const e of enemies) drawEnemy(e);
    for (const p of particles) {
      ctx.globalAlpha = p.life / 30;
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    if (invincible === 0 || Math.floor(invincible / 5) % 2 === 0) drawPlayer();
    if (levelBanner > 0) {
      ctx.globalAlpha = Math.min(1, levelBanner / 30);
      ctx.fillStyle = '#ff6f9f'; ctx.textAlign = 'center';
      ctx.font = 'bold 36px system-ui, "Malgun Gothic", sans-serif';
      ctx.fillText(`레벨 ${level}! ✨`, W / 2, H / 3);
      ctx.globalAlpha = 1;
    }
  }

  function loop() {
    if (!running || paused) return;
    update();
    draw();
    if (running && !paused) requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    $('overlay').classList.add('hidden');
    sfx.start();
    loop();
  }

  // ---- 일시정지 ----
  function togglePause() {
    if (!running) return;
    paused = !paused;
    keys.left = keys.right = keys.fire = false; touchX = null;
    $('pauseBtn').textContent = paused ? '▶ 계속하기' : '⏸ 일시정지';
    sfx.pause();
    if (paused) {
      draw();
      ctx.fillStyle = 'rgba(255,245,250,.7)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#4a3b5c'; ctx.textAlign = 'center';
      ctx.font = 'bold 40px system-ui, "Malgun Gothic", sans-serif';
      ctx.fillText('⏸ 일시정지', W / 2, H / 2 - 10);
      ctx.font = '18px system-ui, "Malgun Gothic", sans-serif';
      ctx.fillText('P 키나 계속하기 버튼을 누르세요', W / 2, H / 2 + 28);
    } else {
      loop();
    }
  }
  // 다른 창으로 가면 자동으로 일시정지
  document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) togglePause(); });

  function gameOver() {
    running = false;
    sfx.over();
    draw();
    $('score').textContent = score;
    const isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem('shooter-best', best); } catch {}
      $('best').textContent = best;
    }
    $('title').textContent = '게임 오버';
    $('msg').innerHTML =
      `<span class="scores"><span>이번 점수<b>${score}</b></span><span>최고 점수<b>${best}</b></span></span>` +
      (isBest && score > 0 ? '🎉 새로운 최고 기록!<br>' : '') +
      (isTouch ? '화면을 터치하면 다시 시작' : '엔터를 눌러 다시 시작');
    $('start').textContent = '다시 하기';
    $('overlay').classList.remove('hidden');
  }

  // ---- 조작 ----
  const setKey = (e, down) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = down;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = down;
    else if (e.code === 'Space') keys.fire = down;
    else return false;
    return true;
  };
  addEventListener('keydown', e => {
    if (e.code === 'KeyP' && !e.repeat) return togglePause();
    if (e.code === 'KeyM' && !e.repeat) return toggleSound();
    if (paused) return;
    if (setKey(e, true)) e.preventDefault();
    if (!running && (e.code === 'Enter' || e.code === 'Space') && !e.repeat) { e.preventDefault(); start(); }
  });
  addEventListener('keyup', e => setKey(e, false));

  const toCanvasX = e => {
    const rect = cv.getBoundingClientRect();
    return (e.clientX - rect.left) * (W / rect.width);
  };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running) return start();
    if (paused) return togglePause();
    if (e.pointerType === 'touch') isTouch = true;
    dragStartX = toCanvasX(e);
    dragStartPlayer = player.x;
    touchX = player.x;
    try { cv.setPointerCapture(e.pointerId); } catch {}
  });
  cv.addEventListener('pointermove', e => {
    if (touchX === null || paused) return;
    touchX = Math.max(player.r, Math.min(W - player.r, dragStartPlayer + (toCanvasX(e) - dragStartX)));
  });
  addEventListener('pointercancel', () => { touchX = null; });
  // 시작/게임 오버 화면 아무 곳이나 터치해도 시작
  $('overlay').addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') isTouch = true;
    if (!running && e.target.id !== 'start') { e.preventDefault(); start(); }
  });
  $('pauseBtn').onclick = e => { e.currentTarget.blur(); togglePause(); };
  $('soundBtn').onclick = e => { e.currentTarget.blur(); toggleSound(); };
  addEventListener('pointerup', () => { touchX = null; });

  $('start').onclick = e => { e.currentTarget.blur(); start(); };
  reset();
  draw();
</script>
</body>
</html>
